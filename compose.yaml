name: storyguard

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://storyguard:${POSTGRES_PASSWORD:-storyguard}@postgres:5432/storyguard
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: storyguard
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-storyguard-dev}
      MINIO_BUCKET: storyguard-manuscripts
      MANUSCRIPT_MAX_BYTES: ${MANUSCRIPT_MAX_BYTES:-52428800}
      RABBITMQ_URL: amqp://storyguard:${RABBITMQ_PASSWORD:-storyguard}@rabbitmq:5672/
      LITELLM_URL: http://litellm:4000
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-storyguard-local}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    build: ./backend
    command:
      - taskiq
      - worker
      - --ack-type
      - when_executed
      - app.queue.broker:broker
      - app.queue.tasks.smoke
      - app.queue.tasks.ingestion
    environment:
      DATABASE_URL: postgresql+asyncpg://storyguard:${POSTGRES_PASSWORD:-storyguard}@postgres:5432/storyguard
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: storyguard
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-storyguard-dev}
      MINIO_BUCKET: storyguard-manuscripts
      RABBITMQ_URL: amqp://storyguard:${RABBITMQ_PASSWORD:-storyguard}@rabbitmq:5672/
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: storyguard
      POSTGRES_USER: storyguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storyguard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: storyguard
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-storyguard}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: storyguard
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-storyguard-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-storyguard-local}
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  elasticsearch_data:
  model_cache:
