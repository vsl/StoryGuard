# StoryGuard project-scoped Codex settings.
# Provider/auth configuration belongs in ~/.codex/config.toml, not this file.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
model_reasoning_effort = "high"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = true
